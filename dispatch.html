<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dispatch</title>
<style>
:root{--bg:#0a0f1a;--card:#1a2332;--text:#f1f5f9;--teal:#14b8a6;--border:rgba(148,163,184,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui;padding:12px 12px 80px}
.header{text-align:center;padding:12px;font-weight:750}
.order{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.party{font-weight:750;color:#5eead4}
.model{color:#fbbf24}
button{border:0;border-radius:10px;padding:12px;background:#0d9488;color:#fff;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0f1a;border-top:1px solid var(--border);display:flex}
.nav button{background:transparent;color:#94a3b8;border-radius:0;flex:1}
.nav button.on{color:var(--teal);background:rgba(20,184,166,.15)}
.section{display:none}.section.on{display:block}
input,select{width:100%;padding:10px;background:#111827;color:#fff;border:1px solid var(--border);border-radius:8px;margin:4px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1}
</style>
</head>
<body>
<div class="header">Dispatch <button id="langBtn" onclick="toggleLang()" style="float:right;padding:6px 10px;font-size:.75rem;background:#1e293b">EN</button></div>
<section id="orders" class="section on">
  <input id="q" placeholder="Search..." oninput="renderOrders()">
  <div id="list"></div>
</section>
<section id="today" class="section">
  <div class="card"><b>Today's Work</b></div>
  <div id="todayList"></div>
</section>
<section id="parcels" class="section">
  <div id="parcelOrders"></div>
  <div class="card">
    <div id="summary"></div>
    <button onclick="addP()" style="width:100%;margin-top:8px">+ New Parcel</button>
    <button onclick="window.doConfirm()" style="width:100%;margin-top:8px;background:#16a34a">Confirm & Save</button>
  </div>
</section>
<nav class="nav">
  <button class="on" onclick="show('orders',this)">Orders</button>
  <button onclick="show('today',this)">Today</button>
  <button onclick="show('parcels',this)">Parcels</button>
</nav>
<script>
window.doConfirm=function(){ alert("Loading..."); };
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
const cfg={apiKey:"AIzaSyDgasnH2Jf05M2M48r8VmODPYXGOxqZVgU",authDomain:"d-ent-379f4.firebaseapp.com",databaseURL:"https://d-ent-379f4-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"d-ent-379f4"};
const db=getDatabase(initializeApp(cfg));
const dataRef=ref(db,"production");
let O=[], RM={}, D=[], PS=[{id:1,items:[]}];
onValue(ref(db,"production/PARCELS"), snap=>{
  const v=snap.val();
  if(Array.isArray(v)&&v.length) PS=v.map(p=>({id:p.id||Date.now(), items:Array.isArray(p.items)?p.items:[]}));
  renderP();
});
onValue(dataRef, snap=>{
  const d=snap.val()||{};
  O=Array.isArray(d.O)?d.O:[];
  RM=d.RM||{};
  D=Array.isArray(d.D)?d.D:[];
  
  renderOrders();
  renderToday();
  renderP();
});
function show(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("on"));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  if(btn) btn.classList.add("on");
  if(id==="parcels") renderP();
}
window.show=show;

const GU_MAP={
  "Baleno":"બેલેનો","Swift":"સ્વિફ્ટ","Dzire":"ડિઝાયર","Tiago":"ટિયાગો","Punch":"પંચ","PUNCH EV":"પંચ ઈવી",
  "Innova":"ઇનોવા","INNOVA":"ઇનોવા","INNOVA CRYSTA":"ઇનોવા ક્રિસ્ટા","Ertiga":"એર્ટિગા","ERTIGA":"એર્ટિગા",
  "Nexon":"નેક્સન","Venue":"વેન્યુ","XUV":"એક્સયુવી","Creta":"ક્રેટા","Alto":"આલ્ટો",
  "3D CHEX BLACK":"3D ચેક્સ બ્લેક","3D BLACK":"3D બ્લેક","3D GOLD":"3D ગોલ્ડ","CRUSH BLACK":"ક્રશ બ્લેક",
  "CAR STUDIO":"કાર સ્ટુડિયો","All":"બધા"
};
function gu(s){ if(LANG!=="GU") return s; return GU_MAP[s]||s; }

let LANG="EN";
const T={EN:{disp:"Dispatch",today:"Today",orders:"Orders",parcels:"Parcels",search:"Search...",all:"All"},GU:{disp:"ડિસ્પેચ",today:"આજ",orders:"ઓર્ડર",parcels:"પાર્સલ",search:"શોધો...",all:"બધા"}};
function applyLang(){
  document.getElementById("langBtn").textContent=LANG;
  document.getElementById("q").placeholder=T[LANG].search;
  const navs=document.querySelectorAll(".nav button");
  if(navs[0]) navs[0].textContent=T[LANG].orders;
  if(navs[1]) navs[1].textContent=T[LANG].today;
  if(navs[2]) navs[2].textContent=T[LANG].parcels;
}
function toggleLang(){ LANG=LANG==="EN"?"GU":"EN"; applyLang(); renderOrders(); }
window.toggleLang=toggleLang;
function renderOrders(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  let L=O.filter(o=>Number(o.s||0)>0);
  if(q) L=L.filter(o=>((o.p||"")+" "+(o.m||"")).toLowerCase().includes(q));
  document.getElementById("list").innerHTML=L.map(o=>`
    <div class="order"><div class="party">${gu(o.p)}</div><div class="model">${gu(o.m)}</div>
    <div>Dispatch ${o.x||0} / ${o.s}</div>
    <div class="row"><button onclick="chg(${o.id},-1)">-1</button><button onclick="chg(${o.id},1)">+1</button></div></div>`).join("")||"<div style='text-align:center;color:#64748b;padding:40px'>Nothing ready</div>";
}
function renderToday(){
  const el=document.getElementById("todayList");
  if(!D.length){ el.innerHTML="<div style='text-align:center;color:#64748b;padding:40px'>None</div>"; return; }
  el.innerHTML=D.map(w=>{const o=O.find(x=>x.id==w.id); return o?`<div class="order"><div class="party">${gu(o.p)}</div><div class="model">${gu(o.m)}</div><div>Qty ${w.q}</div></div>`:"";}).join("");
}
window.chg=(id,d)=>{const o=O.find(x=>x.id==id);if(!o)return;o.x=Math.max(0,Math.min(o.s,Number(o.x||0)+d));update(dataRef,{O,RM});};
function used(oid){let n=0;PS.forEach(p=>(p.items||[]).forEach(it=>{if(it.oid===oid)n+=Number(it.qty)||0;}));return n;}
function renderP(){
  const ready=O.filter(o=>Number(o.s||0)>0);
  document.getElementById("parcelOrders").innerHTML=ready.map(o=>{
    const left=Math.max(0,Number(o.s||0)-used(o.id));
    return `<div class="order"><div class="party">${gu(o.p)}</div><div class="model">${gu(o.m)} · Left ${left}</div>
    <div class="row">
      <input id="q${o.id}" type="number" value="1" style="flex:1">
      <select id="p${o.id}" style="flex:1">${PS.map((p,i)=>`<option value="${i}">Parcel ${i+1}</option>`).join("")}</select>
      <button onclick="add(${o.id})" style="flex:1">Add</button>
    </div></div>`;
  }).join("")||"<div style='text-align:center;color:#64748b;padding:20px'>None</div>";
  let tot=0;
  document.getElementById("summary").innerHTML=PS.map((p,i)=>{
    const m={};(p.items||[]).forEach(it=>{m[it.model]=(m[it.model]||0)+Number(it.qty||0);});
    const q=Object.values(m).reduce((s,v)=>s+v,0); tot+=q;
    const txt=Object.entries(m).map(([k,v])=>v+" "+k).join(" + ")||"—";
    return `<div style="margin:6px 0;padding:8px;background:#111827;border-radius:8px"><b>Parcel ${i+1}</b>: ${txt}<br><span style="color:#5eead4">${q} pcs</span>
    <div>${(p.items||[]).map((it,j)=>`<button onclick="rm(${i},${j})" style="padding:4px 8px;font-size:.75rem;margin:2px;background:#dc2626">x ${it.qty} ${it.model}</button>`).join("")}</div></div>`;
  }).join("")+`<div style="margin-top:10px;padding:10px;background:#0d9488;border-radius:8px;text-align:center;font-weight:800">Total: ${tot} pcs</div>`;
}
window.addP=()=>{PS.push({id:Date.now(),items:[]});renderP();};
window.add=function(oid){
  const o=O.find(x=>x.id==oid); if(!o) return alert("Not found");
  const left=Number(o.s||0)-used(oid);
  const qty=Math.min(Number(document.getElementById("q"+oid).value)||1, left);
  if(qty<1) return alert("Nothing left");
  const idx=Number(document.getElementById("p"+oid).value)||0;
  if(!PS[idx]) return alert("No parcel");
  if(!PS[idx].items) PS[idx].items=[];
  PS[idx].items.push({model:o.m, qty, oid});
  renderP();
};
window.rm=(pi,ii)=>{if(PS[pi]&&PS[pi].items){PS[pi].items.splice(ii,1);renderP();}};
window.doConfirm=function(){
  try{
  const clean=PS.map(p=>({id:p.id, items:(p.items||[]).map(it=>({model:String(it.model||""),qty:Number(it.qty)||0,oid:it.oid}))}));
  const count=clean.reduce((s,p)=>s+(p.items||[]).length,0);
  if(count===0) return alert("Add cars to a parcel first, then Confirm");
  const add={};
  clean.forEach(p=>(p.items||[]).forEach(it=>{add[it.oid]=(add[it.oid]||0)+it.qty;}));
  O.forEach(o=>{if(add[o.id]) o.x=Math.min(Number(o.s||0), Number(o.x||0)+add[o.id]);});
  update(dataRef,{O,RM,PARCELS:clean})
    .then(()=>alert("Confirmed! "+count+" items saved and marked dispatched"))
    .catch(e=>alert("Failed: "+(e.message||"error")));
  }catch(err){ alert("Error: "+err.message); }
};
</script>
</body>
</html>
